<nav class="fixed top-0 left-0 h-screen w-64 bg-[#006D77] flex flex-col z-50 shadow-xl">
    <!-- Logo -->
    <!-- Logo & Notifications -->
    <div class="px-6 py-6 border-b border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                <span class="text-white text-xl">🌿</span>
            </div>
            <div>
                <h1 class="text-white font-bold text-base leading-tight">Jungle In</h1>
                <p class="text-white/60 text-xs">English — Employee</p>
            </div>
        </div>

        <!-- Simple Notification Bell -->
        <div class="relative">
            <button (click)="toggleNotifications()" 
                    class="relative p-2 text-white/70 hover:text-white hover:bg-white/10 rounded-xl transition-all">
                <span class="text-xl">🔔</span>
                <span *ngIf="(unreadCount$ | async) as count" 
                      class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center shadow-lg animate-pulse">
                    {{ count }}
                </span>
            </button>

            <!-- Simple Dropdown -->
            <div *ngIf="showNotifications" 
                 class="absolute top-12 right-0 w-80 bg-white rounded-xl shadow-2xl overflow-hidden z-[9999] border border-gray-100"
                 style="position: fixed; top: 60px; right: 20px;">
                <div class="px-4 py-3 bg-[#006D77] text-white flex items-center justify-between">
                    <h3 class="font-bold text-sm">Notifications</h3>
                </div>
                
                <div class="max-h-[400px] overflow-y-auto">
                    <div *ngIf="(notifications$ | async) as notifications; else loading">
                        <div *ngIf="notifications.length === 0" class="py-8 text-center text-gray-400">
                            <p class="text-sm">No new notifications</p>
                        </div>
                        
                        <div *ngFor="let n of notifications" 
                             class="px-4 py-3 border-b border-gray-50 hover:bg-gray-50 transition-all cursor-pointer group"
                             (click)="n.id && markAsRead(n.id)">
                            <div class="flex justify-between items-start">
                                <div class="flex-1 pr-2">
                                    <p class="text-xs font-bold text-gray-900">{{ n.title }}</p>
                                    <p class="text-xs text-gray-500 mt-1">{{ n.message }}</p>
                                    <span class="text-[10px] text-gray-400">{{ n.createdAt | date:'short' }}</span>
                                </div>
                                <button (click)="n.id && deleteNotification(n.id, $event)" 
                                        class="p-1 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                                    <span class="text-sm">×</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <ng-template #loading>
                        <div class="p-4 text-center text-gray-400">
                            <span class="text-xs">Loading...</span>
                        </div>
                    </ng-template>
                </div>
                
                <div class="p-3 text-center border-t border-gray-50 bg-gray-50">
                    <button (click)="markAllAsRead()" 
                            class="text-xs text-[#006D77] hover:underline font-medium">
                        Mark all as read
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Nav Items -->
    <div class="flex-1 py-4 overflow-y-auto">
        <a routerLink="dashboard" routerLinkActive="bg-white/20 text-white"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/70 hover:bg-white/10 hover:text-white transition-all mx-2 mb-1">
            <span class="text-xl">🏠</span>
            <span class="font-medium">Dashboard</span>
        </a>
        <a routerLink="recruitments" routerLinkActive="bg-white/20 text-white"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/70 hover:bg-white/10 hover:text-white transition-all mx-2 mb-1">
            <span class="text-xl">💼</span>
            <span class="font-medium">Open Recruitments</span>
        </a>
        <a routerLink="applications" routerLinkActive="bg-white/20 text-white"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-white/70 hover:bg-white/10 hover:text-white transition-all mx-2 mb-1">
            <span class="text-xl">📋</span>
            <span class="font-medium text-sm">My Applications</span>
        </a>
    </div>

    <!-- Bottom Actions -->
    <div class="px-4 py-4 border-t border-white/10 mt-auto shrink-0 bg-[#005a63]/30">
        <a routerLink="profile" routerLinkActive="bg-white/10"
            class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-white/90 hover:bg-white/10 transition-all mb-2">
            <span class="text-xl">👤</span>
            <span class="font-medium text-sm">Profile</span>
        </a>
        <button (click)="logout()"
            class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-white/60 hover:bg-white/10 hover:text-white transition-all">
            <span class="text-xl">🚪</span>
            <span class="font-medium text-sm">Logout</span>
        </button>
    </div>
</nav>
