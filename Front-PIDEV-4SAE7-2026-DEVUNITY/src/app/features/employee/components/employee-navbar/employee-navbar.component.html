<nav class="glass-navbar">
    <div class="nav-content">

        <!-- BRAND -->
        <div class="nav-left">
            <a routerLink="dashboard" class="brand">
                <img src="logo.png" alt="Jungle In English" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">JUNGLE <span>IN ENGLISH</span></span>
                    <span class="brand-sub">Employee Portal</span>
                </div>
            </a>
        </div>

        <!-- MAIN LINKS -->
        <div class="nav-center">
            <a routerLink="dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </a>

            <a routerLink="recruitments" routerLinkActive="active" class="nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                    <path d="M16 7V5a2 2 0 0 0-4 0v2"></path>
                    <path d="M8 7V5a2 2 0 0 1 4 0v2"></path>
                    <line x1="12" y1="12" x2="12" y2="16"></line>
                    <line x1="10" y1="14" x2="14" y2="14"></line>
                </svg>
                <span>Open Recruitments</span>
            </a>

            <a routerLink="applications" routerLinkActive="active" class="nav-link highlight">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="9" y1="13" x2="15" y2="13"></line>
                    <line x1="9" y1="17" x2="13" y2="17"></line>
                </svg>
                <span>My Applications</span>
            </a>
        </div>

        <!-- RIGHT -->
        <div class="nav-right">

            <!-- Notification Bell -->
            <div class="notification-wrapper">
                <button (click)="toggleNotifications()" class="notif-btn" [class.active]="showNotifications"
                    title="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span *ngIf="(unreadCount$ | async) as count" class="notif-badge">{{ count }}</span>
                </button>

                <!-- Notification Dropdown -->
                <div *ngIf="showNotifications" class="notif-dropdown">
                    <div class="notif-header">
                        <h3>Notifications</h3>
                        <button (click)="markAllAsRead()" class="mark-all-btn">Mark all read</button>
                    </div>

                    <div class="notif-body">
                        <ng-container *ngIf="(notifications$ | async) as notifications; else loading">
                            <div *ngIf="notifications.length === 0" class="notif-empty">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg>
                                <p>No new notifications</p>
                            </div>

                            <div *ngFor="let n of notifications" class="notif-item" (click)="n.id && markAsRead(n.id)">
                                <div class="notif-dot"></div>
                                <div class="notif-item-content">
                                    <p class="notif-title">{{ n.title }}</p>
                                    <p class="notif-message">{{ n.message }}</p>
                                    <span class="notif-time">{{ n.createdAt | date:'short' }}</span>
                                </div>
                                <button (click)="n.id && deleteNotification(n.id, $event)" class="notif-delete">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </ng-container>

                        <ng-template #loading>
                            <div class="notif-loading">
                                <div class="loading-spinner"></div>
                                <span>Loading...</span>
                            </div>
                        </ng-template>
                    </div>
                </div>

                <!-- Backdrop -->
                <div *ngIf="showNotifications" class="notif-backdrop" (click)="showNotifications = false"></div>
            </div>

            <!-- User Info -->
            <div class="user-info">
                <div class="avatar-sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <span class="user-label">{{ name }}</span>
            </div>

            <!-- Profile Button -->
            <a routerLink="profile" class="profile-btn" title="View Profile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </a>

            <!-- Logout Button -->
            <button (click)="logout()" class="logout-btn" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>

        </div>
    </div>
</nav>
<div class="navbar-spacer"></div>
