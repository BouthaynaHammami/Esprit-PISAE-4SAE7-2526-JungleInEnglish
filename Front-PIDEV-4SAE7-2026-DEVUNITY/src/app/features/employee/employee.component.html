<!-- src/app/features/employee/employee.component.html -->

<!-- Navbar -->
<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 bg-gradient-to-br from-[#006D77] to-[#83C5BE] rounded-xl flex items-center justify-center text-xl">
                🎓</div>
            <span class="text-xl font-bold text-[#006D77]">Jungle In English</span>
        </div>
        <h1 class="text-lg font-semibold text-gray-700">📋 Job Board</h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-gray-100 rounded-full px-4 py-2">
                <span class="text-lg">👤</span>
                <span class="text-sm font-medium text-gray-700">{{ email }}</span>
            </div>
            <button (click)="logout()"
                class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 font-medium rounded-lg hover:bg-red-100 transition-colors text-sm">
                <span>🚪</span> Logout
            </button>
        </div>
    </div>
</nav>

<div class="min-h-screen bg-gray-50">
    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Header Banner -->
        <div class="rounded-2xl bg-gradient-to-r from-[#006D77] to-[#83C5BE] p-8 mb-8 text-white shadow-lg">
            <h2 class="text-3xl font-bold mb-2">Open Positions 🌟</h2>
            <p class="text-white/80">{{ jobs.length }} positions currently open at Jungle In English</p>
        </div>

        <!-- Job Cards Grid -->
        <div class="grid grid-cols-3 gap-6">
            <div *ngFor="let job of jobs"
                class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg hover:-translate-y-1 transition-all duration-200 flex flex-col">

                <!-- Job Header -->
                <div class="bg-gradient-to-r from-gray-50 to-white p-5 border-b border-gray-100">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-11 h-11 rounded-xl bg-[#006D77]/10 flex items-center justify-center text-2xl flex-shrink-0">
                                {{ job.icon }}
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-base leading-tight">{{ job.title }}</h3>
                                <p class="text-xs text-gray-500 mt-0.5">{{ job.department }}</p>
                            </div>
                        </div>
                        <span *ngIf="job.urgent"
                            class="text-xs font-bold px-2 py-1 bg-red-100 text-red-600 rounded-full whitespace-nowrap flex-shrink-0">
                            🔥 Urgent
                        </span>
                    </div>
                </div>

                <!-- Job Body -->
                <div class="p-5 flex-1 flex flex-col gap-3">
                    <p class="text-sm text-gray-600 leading-relaxed flex-1">{{ job.description }}</p>

                    <!-- Tags -->
                    <div class="flex flex-wrap gap-2">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" [ngClass]="typeColor(job.type)">
                            {{ job.type }}
                        </span>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 text-gray-600">
                            📍 {{ job.location }}
                        </span>
                    </div>

                    <div class="text-xs text-gray-400 pt-1">Posted {{ job.posted }}</div>
                </div>

                <!-- Apply Button -->
                <div class="px-5 pb-5">
                    <button
                        class="w-full py-2.5 bg-[#006D77] text-white font-semibold rounded-xl hover:bg-[#005560] transition-colors text-sm">
                        Apply Now →
                    </button>
                </div>

            </div>
        </div>

    </div>
</div>
