<div class="min-h-screen p-8 bg-[#EDF6F9]/50 animate-fade-in">
    <!-- 1. Header Élégant -->
    <div class="mb-10 flex justify-between items-center">
        <div class="flex items-center gap-5">
            <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#006D77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-[#006D77] tracking-tight">My Profile</h1>
                <p class="text-[#83C5BE] font-medium">Manage and monitor your account information</p>
            </div>
        </div>
        
        <button (click)="editProfile()" class="px-6 py-2.5 border-2 border-[#006D77] text-[#006D77] rounded-xl hover:bg-[#006D77] hover:text-white transition-all duration-300 font-bold flex items-center gap-2 text-sm shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            Edit Profile
        </button>
    </div>

    <div class="max-w-4xl mx-auto">
        <!-- Loading State (Skeleton) -->
        <div *ngIf="loading" class="space-y-6">
            <div class="h-48 bg-white rounded-[32px] animate-pulse"></div>
            <div class="grid grid-cols-2 gap-6">
                <div *ngFor="let i of [1,2,3,4]" class="h-24 bg-white rounded-[24px] animate-pulse"></div>
            </div>
        </div>

        <!-- 2. Profile Card Redesign (Actual Content) -->
        <div *ngIf="!loading" class="bg-white rounded-[32px] shadow-[0_20px_50px_rgba(0,109,119,0.05)] border border-white overflow-hidden animate-scale-up">
            
            <!-- 3. Hero Profile Section -->
            <div class="relative h-48 bg-gradient-to-r from-[#006D77] to-[#83C5BE]">
                <div class="absolute -bottom-16 left-10 flex items-end gap-6">
                    <!-- Avatar Élégant -->
                    <div class="relative">
                        <div class="w-32 h-32 rounded-[32px] bg-white p-1 shadow-2xl">
                            <div class="w-full h-full rounded-[28px] bg-gradient-to-br from-[#006D77] to-[#83C5BE] flex items-center justify-center text-white text-4xl font-black border-4 border-white/20">
                                {{ avatarLetter }}
                            </div>
                        </div>
                        <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-[#FFDDD2] rounded-2xl flex items-center justify-center shadow-lg border-4 border-white text-[#E29578]">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                        </div>
                    </div>
                    
                    <!-- Informations Principales -->
                    <div class="mb-2 pb-2">
                        <h2 class="text-3xl font-black text-[#006D77] tracking-tight">{{ firstName }} {{ lastName }}</h2>
                        <div class="flex items-center gap-3 mt-1">
                            <span [class]="'px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ' + getRoleBadgeClass()">
                                {{ role }}
                            </span>
                            <span class="text-[#83C5BE] font-bold text-sm flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-[#83C5BE] animate-pulse"></span>
                                {{ accountStatus }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Spacer for hero offset -->
            <div class="h-20"></div>

            <!-- 4. Information Cards Grid -->
            <div class="p-10 grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Email Card -->
                <div class="group p-6 bg-[#EDF6F9]/40 rounded-[24px] border border-transparent hover:border-[#83C5BE]/30 hover:bg-white hover:shadow-xl hover:shadow-[#006D77]/5 transition-all duration-300">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-[#006D77] group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-[#83C5BE] uppercase tracking-[0.2em] mb-1">Email Address</p>
                            <p class="text-[#006D77] font-bold text-base truncate">{{ email }}</p>
                        </div>
                    </div>
                </div>

                <!-- Session Card -->
                <div class="group p-6 bg-[#EDF6F9]/40 rounded-[24px] border border-transparent hover:border-[#83C5BE]/30 hover:bg-white hover:shadow-xl hover:shadow-[#006D77]/5 transition-all duration-300">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-[#E29578] group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-[#83C5BE] uppercase tracking-[0.2em] mb-1">Session Expiration</p>
                            <p class="text-[#006D77] font-bold text-base">{{ expiryDate }}</p>
                        </div>
                    </div>
                </div>

                <!-- Last Login Card -->
                <div class="group p-6 bg-[#EDF6F9]/40 rounded-[24px] border border-transparent hover:border-[#83C5BE]/30 hover:bg-white hover:shadow-xl hover:shadow-[#006D77]/5 transition-all duration-300">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-[#83C5BE] group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-[#83C5BE] uppercase tracking-[0.2em] mb-1">Last Activity</p>
                            <p class="text-[#006D77] font-bold text-base">{{ lastLogin }}</p>
                        </div>
                    </div>
                </div>

                <!-- Status Card -->
                <div class="group p-6 bg-[#EDF6F9]/40 rounded-[24px] border border-transparent hover:border-[#83C5BE]/30 hover:bg-white hover:shadow-xl hover:shadow-[#006D77]/5 transition-all duration-300">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-green-500 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-[#83C5BE] uppercase tracking-[0.2em] mb-1">Account Status</p>
                            <p class="text-[#006D77] font-bold text-base">Verified & Active</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 6. Action Buttons -->
            <div class="p-10 pt-4 flex flex-wrap gap-4 border-t border-gray-50 bg-gray-50/30">
                <button (click)="editProfile()" class="flex-1 min-w-[200px] py-4 bg-[#006D77] text-white rounded-[20px] font-bold shadow-lg shadow-[#006D77]/20 hover:bg-[#83C5BE] hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-3">
                    Update Profile Details
                </button>
                <button class="flex-1 min-w-[200px] py-4 bg-white border-2 border-[#83C5BE] text-[#006D77] rounded-[20px] font-bold hover:bg-[#EDF6F9] hover:-translate-y-1 transition-all duration-300">
                    Security & Password
                </button>
                <button (click)="logout()" class="px-8 py-4 bg-[#E29578] text-white rounded-[20px] font-bold shadow-lg shadow-[#E29578]/20 hover:bg-[#006D77] hover:-translate-y-1 transition-all duration-300 flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    Logout
                </button>
            </div>
        </div>
    </div>
</div>
