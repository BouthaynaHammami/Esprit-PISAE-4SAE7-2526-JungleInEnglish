<div class="p-4 h-screen flex flex-col">
    <!-- Clean Minimal Header -->
    <div class="mb-4 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-[#006D77]">Platform Insights 🛡️</h1>
            <p class="text-sm text-gray-500">Real-time system monitoring and analytics.</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="px-3 py-1 bg-teal-50 text-[#006D77] rounded-full text-xs font-semibold uppercase tracking-wider animate-pulse">
                Live Feed
            </div>
        </div>
    </div>

    <!-- Kibana Dashboard Embed (Maximizing Space) -->
    <div class="flex-grow bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative">
        <iframe 
            [src]="kibanaUrl" 
            class="absolute inset-0 w-full h-full border-none"
            allowfullscreen>
        </iframe>
    </div>
    
    <!-- Footer Context -->
    <div class="mt-3 flex items-center justify-between text-[10px] text-gray-400 uppercase tracking-widest">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span>Elastic Stack Connected</span>
        </div>
        <span>Last synchronization: Just now</span>
    </div>
</div>
