<div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 mb-6">
    <h3 class="text-xl font-bold text-gray-800 mb-5">{{ isEditing ? 'Edit Room' : 'New Room' }}</h3>

    <div *ngIf="error" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm">
        ⚠️ {{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Room Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Room Name <span class="text-red-500">*</span>
            </label>
            <input formControlName="name" type="text" placeholder="e.g. C001"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#006D77]">
            <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-xs text-red-500 mt-1">
                Room name is required.</p>
        </div>

        <!-- Capacity -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Capacity <span class="text-red-500">*</span>
            </label>
            <input formControlName="capacity" type="number" min="1" placeholder="e.g. 30"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#006D77]">
            <p *ngIf="form.get('capacity')?.invalid && form.get('capacity')?.touched" class="text-xs text-red-500 mt-1">
                Capacity must be at least 1.</p>
        </div>

        <!-- Level -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Level <span class="text-red-500">*</span>
            </label>
            <input formControlName="level" type="number" min="1" placeholder="e.g. 1"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#006D77]">
            <p *ngIf="form.get('level')?.invalid && form.get('level')?.touched" class="text-xs text-red-500 mt-1">Level
                must be at least 1.</p>
        </div>

        <!-- Available toggle -->
        <div class="md:col-span-2">
            <label class="flex items-center gap-3 cursor-pointer select-none w-fit">
                <div class="relative">
                    <input type="checkbox" formControlName="available" class="sr-only peer">
                    <div class="w-10 h-6 bg-gray-200 rounded-full peer-checked:bg-[#006D77] transition-colors"></div>
                    <div
                        class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-4">
                    </div>
                </div>
                <span class="text-sm font-medium text-gray-700">Room is Available</span>
            </label>
        </div>

        <!-- Actions -->
        <div class="md:col-span-2 flex gap-3 pt-2">
            <button type="submit" [disabled]="isSaving"
                class="px-6 py-2.5 bg-[#006D77] text-white font-semibold rounded-lg hover:bg-[#005560] transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                {{ isSaving ? 'Saving...' : (isEditing ? 'Update Room' : 'Create Room') }}
            </button>
            <button type="button" (click)="cancelled.emit()"
                class="px-6 py-2.5 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition-colors">
                Cancel
            </button>
        </div>

    </form>
</div>
