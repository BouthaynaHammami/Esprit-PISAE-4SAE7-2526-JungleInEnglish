<div class="max-w-7xl mx-auto px-6 py-8">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-[#006D77]">Classes</h2>
            <p class="text-gray-500 mt-1 text-sm">Manage student classes</p>
        </div>
        <button (click)="openAdd()"
            class="px-5 py-2.5 bg-[#006D77] text-white font-semibold rounded-lg hover:bg-[#005560] transition-colors">
            + Add Class
        </button>
    </div>

    <!-- Success -->
    <div *ngIf="successMessage"
        class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm font-medium">
        ✅ {{ successMessage }}
    </div>

    <!-- Error -->
    <div *ngIf="error && !showForm" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm">
        ⚠️ {{ error }}
        <button (click)="load()" class="ml-3 underline hover:no-underline">Retry</button>
    </div>

    <!-- Form -->
    <div *ngIf="showForm" class="mb-6">
        <app-class-form [cls]="editingClass" (saved)="onSaved()" (cancelled)="onCancelled()">
        </app-class-form>
    </div>

    <!-- Detail -->
    <div *ngIf="viewingClass && !showForm" class="mb-6">
        <app-class-detail [cls]="viewingClass" (closed)="viewingClass = null" (edit)="openEdit($event)">
        </app-class-detail>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="flex justify-center py-20">
        <div class="w-10 h-10 border-4 border-[#006D77] border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading && classes.length === 0 && !error" class="text-center py-20">
        <p class="text-5xl mb-4">🏫</p>
        <p class="text-gray-500 text-lg mb-4">No classes yet.</p>
        <button (click)="openAdd()"
            class="px-5 py-2.5 bg-[#006D77] text-white font-semibold rounded-lg hover:bg-[#005560] transition-colors">
            + Add First Class
        </button>
    </div>

    <!-- Table -->
    <div *ngIf="!isLoading && classes.length > 0"
        class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="text-left px-5 py-3 font-semibold text-gray-600">Class Name</th>
                    <th class="text-left px-5 py-3 font-semibold text-gray-600">Students</th>
                    <th class="text-left px-5 py-3 font-semibold text-gray-600">Level</th>
                    <th class="text-right px-5 py-3 font-semibold text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let cls of classes" class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                    <td class="px-5 py-4 text-gray-700 font-semibold">{{ cls.name }}</td>
                    <td class="px-5 py-4 font-medium text-gray-900">{{ cls.numberStudents }}</td>
                    <td class="px-5 py-4">
                        <span class="px-2.5 py-1 bg-[#006D77]/10 text-[#006D77] rounded-full text-xs font-semibold">
                            {{ cls.level }}
                        </span>
                    </td>
                    <td class="px-5 py-4 text-right space-x-2">
                        <button (click)="openDetail(cls)"
                            class="px-3 py-1.5 text-xs font-semibold text-[#006D77] border border-[#006D77] rounded-lg hover:bg-[#006D77] hover:text-white transition-colors">
                            View
                        </button>
                        <button (click)="openEdit(cls)"
                            class="px-3 py-1.5 text-xs font-semibold text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">
                            Edit
                        </button>
                        <button (click)="delete(cls)"
                            class="px-3 py-1.5 text-xs font-semibold text-red-600 border border-red-300 rounded-lg hover:bg-red-600 hover:text-white transition-colors">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="px-5 py-3 bg-gray-50 border-t border-gray-200 text-sm text-gray-500">
            {{ classes.length }} class{{ classes.length !== 1 ? 'es' : '' }} total
        </div>
    </div>

</div>
