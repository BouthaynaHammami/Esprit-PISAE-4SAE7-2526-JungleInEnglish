<!-- Floating AI Button -->
<div class="ai-fab" (click)="toggleChat()" [class.open]="isOpen" title="AI Assistant">
  <span class="ai-fab-icon" *ngIf="!isOpen">🤖</span>
  <span class="ai-fab-icon" *ngIf="isOpen">✕</span>
  <span class="ai-fab-label" *ngIf="!isOpen">AI Help</span>
</div>

<!-- Chat Window -->
<div class="ai-chat-window" *ngIf="isOpen">

  <!-- Header -->
  <div class="ai-chat-header">
    <div class="ai-avatar">🤖</div>
    <div class="ai-header-info">
      <span class="ai-name">DevUnity Assistant</span>
      <span class="ai-status">
        <span class="ai-dot"></span> Online
      </span>
    </div>
    <button class="ai-close-btn" (click)="toggleChat()">✕</button>
  </div>

  <!-- Messages -->
  <div class="ai-messages" #messagesContainer>
    <div
      *ngFor="let msg of messages"
      class="ai-message"
      [class.user]="msg.role === 'user'"
      [class.assistant]="msg.role === 'assistant'"
    >
      <div class="ai-bubble">{{ msg.content }}</div>
      <div class="ai-time">{{ msg.time }}</div>
    </div>

    <!-- Typing indicator -->
    <div class="ai-message assistant" *ngIf="isTyping">
      <div class="ai-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="ai-input-area">
    <textarea
      [(ngModel)]="userInput"
      (keydown)="onKeyPress($event)"
      placeholder="Ask me anything..."
      rows="1"
      class="ai-input"
      [disabled]="isTyping"
    ></textarea>
    <button
      class="ai-send-btn"
      (click)="sendMessage()"
      [disabled]="!userInput.trim() || isTyping"
    >
      ➤
    </button>
  </div>
</div>
