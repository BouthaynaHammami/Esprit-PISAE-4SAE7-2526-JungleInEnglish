# ============================================================================
# PRODUCTION CONFIGURATION
# ============================================================================
# Ce fichier doit être utilisé en production avec des variables d'environnement

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Learner_Management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=${SERVER_PORT:8082}

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://keycloak.production.com/realms/devunity}

# Keycloak Admin API
keycloak.auth-server-url=${KEYCLOAK_URL:https://keycloak.production.com}
keycloak.realm=${KEYCLOAK_REALM:devunity}
keycloak.resource=${KEYCLOAK_CLIENT_ID:devunity-app}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

# Logging
logging.level.root=INFO
logging.level.tn.esprit=INFO
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
