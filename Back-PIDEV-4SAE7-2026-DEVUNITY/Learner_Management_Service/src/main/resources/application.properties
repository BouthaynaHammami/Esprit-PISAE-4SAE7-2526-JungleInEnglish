spring.application.name=learner-management-service

spring.datasource.url=jdbc:mysql://localhost:3306/Learner_Management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Base_Securisee_123}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.port=8082

ml.service.base-url=http://localhost:8081/ml/api
ml.service.url=http://ML-SERVICE

#application.security.jwt.secret-key=${JWT_SECRET_KEY}
#application.security.jwt.expiration=86400000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

server.servlet.context-path=/learners/api

############ KEYCLOAK / OAuth2 Resource Server ############
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/devunity}

############ KEYCLOAK ADMIN (pour creer les users via /auth/register) ############
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=devunity
keycloak.resource=devunity-app
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
#management.metrics.export.prometheus.enabled=true

# Gemini API Key (used by AiChatController proxy) — get free key at aistudio.google.com/app/apikey
gemini.api-key=${GEMINI_API_KEY:changeme}