spring.application.name=learner-management-service

spring.datasource.url=jdbc:mysql://localhost:3306/Learner_Management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.port=8082

#application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
#application.security.jwt.expiration=86400000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false

server.servlet.context-path=/learners/api

############ KEYCLOAK / OAuth2 Resource Server ############
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/devunity

############ KEYCLOAK ADMIN (pour creer les users via /auth/register) ############
keycloak.auth-server-url=http://localhost:9090
keycloak.realm=devunity
keycloak.resource=devunity-app
keycloak.admin.username=admin
keycloak.admin.password=admin123

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true