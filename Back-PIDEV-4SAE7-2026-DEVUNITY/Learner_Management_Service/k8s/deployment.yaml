apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner-management-service
  namespace: devunity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learner-management-service
  template:
    metadata:
      labels:
        app: learner-management-service
    spec:
      containers:
        - name: learner-management-service
          image: chelba/learner-management-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/Learner_Management?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://192.168.32.1:8761/eureka"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak-service:8080/realms/devunity"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://keycloak-service:8080"
            - name: KEYCLOAK_REALM
              value: "devunity"
            - name: KEYCLOAK_RESOURCE
              value: "devunity-app"
            - name: KEYCLOAK_ADMIN_USERNAME
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin123"
            - name: SERVER_PORT
              value: "8082"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/learners/api"
          imagePullPolicy: Always