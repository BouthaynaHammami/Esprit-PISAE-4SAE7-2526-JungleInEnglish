apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: devunity
type: Opaque
data:
  # Valeurs injectees via --set dans le Jenkinsfile_CD (ne jamais hardcoder ici)
  # Utiliser: echo -n 'votre_valeur' | base64
  username: "${MYSQL_USERNAME_BASE64}"
  password: "${MYSQL_PASSWORD_BASE64}"
  root-password: "${MYSQL_ROOT_PASSWORD_BASE64}"
