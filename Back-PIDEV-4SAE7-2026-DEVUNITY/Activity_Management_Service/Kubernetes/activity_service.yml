apiVersion: v1
kind: Service
metadata:
  name: activity-management-service
  namespace: devunity
  labels:
    app: activity-management-service
spec:
  type: ClusterIP
  selector:
    app: activity-management-service
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: 8083
  sessionAffinity: None
