# Test Configuration
spring.application.name=activity-management-service-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable mail health check
management.health.mail.enabled=false

# Disable Eureka for tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable Spring Cloud Config
spring.cloud.config.enabled=false

# JWT Security Configuration (Test values)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000

# Disable OAuth2 Resource Server for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Cloudinary Test Configuration
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test

# Email Configuration (Disabled for tests)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test
app.mail.from=test@test.com
app.mail.enabled=false

# ML Service Configuration
ml.service.url=http://localhost:8080
ml.service.endpoint=/ml/api/analyze-cv

# Logging
logging.level.root=WARN
logging.level.tn.esprit=INFO
