apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-social
  labels:
    app: elasticsearch-social
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-social
  template:
    metadata:
      labels:
        app: elasticsearch-social
    spec:
      containers:
        - name: elasticsearch
          image: elasticsearch:8.10.4
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
spec:
  selector:
    app: elasticsearch-social
  ports:
    - protocol: TCP
      port: 9200
      targetPort: 9200
