apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-interaction.fullname" . }}
  labels:
    {{- include "social-interaction.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "social-interaction.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "social-interaction.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/socials/api/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      initContainers:
        - name: wait-for-mysql
          image: docker.io/library/mysql:8.0.32
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql-service --silent; do
                echo "Waiting for MySQL...";
                sleep 3;
              done

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.config.dbUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: db-password
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.MySQLDialect"
            - name: SPRING_ELASTICSEARCH_URIS
              value: {{ .Values.config.elasticsearchUrl | quote }}
            - name: SPRING_ELASTICSEARCH_USERNAME
              value: {{ .Values.config.elasticsearchUsername | default "elastic" | quote }}
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: elasticsearch-password
            - name: SPRING_ELASTICSEARCH_SSL_VERIFICATION_MODE
              value: "none"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration"
            - name: SPRING_RABBITMQ_HOST
              value: "localhost"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server.{{ .Release.Namespace }}.svc.cluster.local:8761/eureka"
            # ✅ Expose toutes les métriques Actuator
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,metrics,info"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"

          livenessProbe:
            httpGet:
              path: /socials/api/actuator/health
              port: 8085
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /socials/api/actuator/health
              port: 8085
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 6

          resources:
            {{- toYaml .Values.resources | nindent 12 }}