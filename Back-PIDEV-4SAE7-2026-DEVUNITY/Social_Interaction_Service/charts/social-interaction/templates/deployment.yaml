apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-interaction.fullname" . }}
  labels:
    {{- include "social-interaction.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "social-interaction.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "social-interaction.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          env:
            # ── Base de données ─ credentials depuis le Secret K8s ──
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.config.dbUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: db-password

            # ── Elasticsearch ─ HTTP sans SSL (xpack.security désactivé) ──
            - name: SPRING_ELASTICSEARCH_URIS
              value: {{ .Values.config.elasticsearchUrl | quote }}
            - name: SPRING_ELASTICSEARCH_USERNAME
              value: {{ .Values.config.elasticsearchUsername | default "elastic" | quote }}
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-interaction.fullname" . }}-db-secret
                  key: elasticsearch-password
            # Désactiver SSL côté client Spring (ES tourne sans xpack)
            - name: SPRING_ELASTICSEARCH_SSL_VERIFICATION_MODE
              value: "none"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration"

            # ── Eureka ─ URL interne Kubernetes (plus localhost) ──
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server.{{ .Release.Namespace }}.svc.cluster.local:8761/eureka"

          # ── Health checks pour que K8s sache si le pod est prêt ──
          livenessProbe:
            httpGet:
              path: /socials/api/actuator/health
              port: 8085
            initialDelaySeconds: 180   # Augmenté de 120 à 180
            periodSeconds: 15
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /socials/api/actuator/health
              port: 8085
            initialDelaySeconds: 120    # Augmenté de 90 à 120
            periodSeconds: 10
            failureThreshold: 6

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
