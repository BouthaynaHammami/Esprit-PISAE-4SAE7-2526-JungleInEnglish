# Ce fichier crée le Secret Kubernetes qui contient les credentials
# sensibles. Les valeurs sont passées via --set dans le Jenkinsfile_CD
# et ne sont jamais stockées en clair dans values.yaml ou le repo Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-interaction.fullname" . }}-db-secret
  labels:
    {{- include "social-interaction.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-username: {{ .Values.config.dbUsername | quote }}
  db-password: {{ .Values.config.dbPassword | quote }}
  elasticsearch-password: {{ .Values.config.elasticsearchPassword | quote }}
