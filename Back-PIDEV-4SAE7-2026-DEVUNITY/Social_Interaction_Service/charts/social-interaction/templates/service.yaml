apiVersion: v1
kind: Service
metadata:
  name: {{ include "social-interaction.fullname" . }}
  labels:
    {{- include "social-interaction.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/socials/api/actuator/prometheus"
    prometheus.io/port: "8085"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "social-interaction.selectorLabels" . | nindent 4 }}