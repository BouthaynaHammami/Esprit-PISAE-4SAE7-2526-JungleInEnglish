# ============================================================================
# PRODUCTION CONFIGURATION - Academic Management Service
# ============================================================================

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Academic_Management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=${SERVER_PORT:8086}

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://keycloak.production.com/realms/devunity}

# Keycloak Configuration
keycloak.realm=${KEYCLOAK_REALM:devunity}
keycloak.auth-server-url=${KEYCLOAK_URL:https://keycloak.production.com}
keycloak.resource=${KEYCLOAK_CLIENT_ID:devunity-app}

# Cloudinary (externaliser les secrets)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Mail (externaliser les secrets)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Logging
logging.level.root=INFO
logging.level.tn.esprit=INFO
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
