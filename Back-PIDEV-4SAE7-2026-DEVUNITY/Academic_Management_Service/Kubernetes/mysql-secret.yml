apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: devunity
type: Opaque
stringData:
  # Valeurs injectées via --set dans le Jenkinsfile_CD (ne jamais hardcoder ici)
  mysql-root-password: "${MYSQL_ROOT_PASSWORD}"
  mysql-database: "Academic_Management"
  mysql-username: "${MYSQL_USERNAME}"